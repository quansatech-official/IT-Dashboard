version: "3.9"

services:
  db:
    image: postgres:16
    container_name: it-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-it_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_secret_password}
    volumes:
      - dashboard-db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: it-dashboard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:-it_secret_password}@db:5432/${POSTGRES_DB:-it_dashboard}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-6}
      INTERNAL_AI_STREAM_TIMEOUT_SECONDS: ${INTERNAL_AI_STREAM_TIMEOUT_SECONDS:-300}
      OLLAMA_REQUEST_KEEP_ALIVE: ${OLLAMA_REQUEST_KEEP_ALIVE:-30m}
      OLLAMA_STREAM_ENABLED: ${OLLAMA_STREAM_ENABLED:-0}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-8}
      OLLAMA_PROMPT_MAX_CHARS: ${OLLAMA_PROMPT_MAX_CHARS:-12000}
      OLLAMA_PROMPT_TOKEN_MARGIN: ${OLLAMA_PROMPT_TOKEN_MARGIN:-96}
      OLLAMA_MAX_TOKENS_HARD_LIMIT: ${OLLAMA_MAX_TOKENS_HARD_LIMIT:-320}
      OLLAMA_SLOW_REQUEST_MS: ${OLLAMA_SLOW_REQUEST_MS:-25000}
      OLLAMA_RESPONSE_CACHE_TTL_SECONDS: ${OLLAMA_RESPONSE_CACHE_TTL_SECONDS:-180}
      OLLAMA_RESPONSE_CACHE_MAX_ENTRIES: ${OLLAMA_RESPONSE_CACHE_MAX_ENTRIES:-400}
      OLLAMA_MISSING_MODEL_TTL_SECONDS: ${OLLAMA_MISSING_MODEL_TTL_SECONDS:-600}
      DB_STARTUP_RETRY_ATTEMPTS: ${DB_STARTUP_RETRY_ATTEMPTS:-30}
      DB_STARTUP_RETRY_DELAY_SECONDS: ${DB_STARTUP_RETRY_DELAY_SECONDS:-2}
      CUSTOMER_META_HUB_URL: ${CUSTOMER_META_HUB_URL:-http://meta-hub:8010}
      CUSTOMER_META_HUB_ENABLED: ${CUSTOMER_META_HUB_ENABLED:-1}
      CUSTOMER_META_HUB_TIMEOUT_SECONDS: ${CUSTOMER_META_HUB_TIMEOUT_SECONDS:-8}
      META_HUB_INTERNAL_TOKEN: ${META_HUB_INTERNAL_TOKEN:-change-me-meta-hub-token}
      INFRA_DISCOVERY_API_URL: ${INFRA_DISCOVERY_API_URL:-}
      INFRA_DISCOVERY_TOKEN: ${INFRA_DISCOVERY_TOKEN:-qt-discovery-token}
    ports:
      - "${BACKEND_PORT:-9873}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 120s

  meta-hub:
    build:
      context: ./meta-hub
    container_name: it-dashboard-meta-hub
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      META_HUB_BACKEND_URL: ${META_HUB_BACKEND_URL:-http://backend:8000}
      META_HUB_REFRESH_SECONDS: ${META_HUB_REFRESH_SECONDS:-300}
      META_HUB_TIMEOUT_SECONDS: ${META_HUB_TIMEOUT_SECONDS:-120}
      META_HUB_CACHE_FILE: ${META_HUB_CACHE_FILE:-/data/customer_development_snapshot.json}
      META_HUB_SOURCE_INCLUDE_INACTIVE: ${META_HUB_SOURCE_INCLUDE_INACTIVE:-1}
      META_HUB_SOURCE_FULL: ${META_HUB_SOURCE_FULL:-1}
      META_HUB_AUTO_REFRESH: ${META_HUB_AUTO_REFRESH:-1}
      META_HUB_INTERNAL_TOKEN: ${META_HUB_INTERNAL_TOKEN:-change-me-meta-hub-token}
      META_HUB_RMM_TIMEOUT_SECONDS: ${META_HUB_RMM_TIMEOUT_SECONDS:-30}
      META_HUB_MAC_VENDOR_LOOKUP_ENABLED: ${META_HUB_MAC_VENDOR_LOOKUP_ENABLED:-1}
      META_HUB_MAC_VENDOR_API_TEMPLATE: ${META_HUB_MAC_VENDOR_API_TEMPLATE:-https://api.macvendors.com/{mac}}
      META_HUB_MAC_VENDOR_TIMEOUT_SECONDS: ${META_HUB_MAC_VENDOR_TIMEOUT_SECONDS:-1.8}
      META_HUB_MAC_VENDOR_MAX_LOOKUPS_PER_REFRESH: ${META_HUB_MAC_VENDOR_MAX_LOOKUPS_PER_REFRESH:-30}
      META_HUB_MAC_VENDOR_CACHE_TTL_SECONDS: ${META_HUB_MAC_VENDOR_CACHE_TTL_SECONDS:-2592000}
    volumes:
      - meta-hub-data:/data
    ports:
      - "${META_HUB_PORT:-8010}:8010"

  marketplace-import-service:
    build:
      context: ./marketplace-import-service
    container_name: it-dashboard-marketplace-import
    restart: unless-stopped
    environment:
      TD_SYNNEX_BASE_URL: ${TD_SYNNEX_BASE_URL:-https://api.streamone.com}
      TD_SYNNEX_TOKEN_URL: ${TD_SYNNEX_TOKEN_URL:-https://api.streamone.com/oauth/token}
      TD_SYNNEX_CLIENT_ID: ${TD_SYNNEX_CLIENT_ID:-}
      TD_SYNNEX_CLIENT_SECRET: ${TD_SYNNEX_CLIENT_SECRET:-}
      TD_SYNNEX_ACCOUNT_ID: ${TD_SYNNEX_ACCOUNT_ID:-}
      ALSO_SFTP_HOST: ${ALSO_SFTP_HOST:-}
      ALSO_SFTP_PORT: ${ALSO_SFTP_PORT:-22}
      ALSO_SFTP_USER: ${ALSO_SFTP_USER:-}
      ALSO_SFTP_PASSWORD: ${ALSO_SFTP_PASSWORD:-}
      ALSO_SFTP_DIR: ${ALSO_SFTP_DIR:-}
      ALSO_FEED_DB_PATH: ${ALSO_FEED_DB_PATH:-/data/also_feed.db}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
    ports:
      - "${MARKETPLACE_IMPORT_PORT:-9876}:8000"
    volumes:
      - marketplace-import-data:/data

  telephony:
    build:
      context: ./backend
    container_name: it-dashboard-telephony
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:-it_secret_password}@db:5432/${POSTGRES_DB:-it_dashboard}}
      NFON_CTI_BASE_URL: ${NFON_CTI_BASE_URL:-}
      NFON_CTI_USER: ${NFON_CTI_USER:-}
      NFON_CTI_PASSWORD: ${NFON_CTI_PASSWORD:-}
      TELEPHONY_STREAM_ENABLED: ${TELEPHONY_STREAM_ENABLED:-}
    command: ["uvicorn", "telephony.app:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
    container_name: it-dashboard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-7000}:80"
    depends_on:
      - oauth2-proxy

  mobile-frontend:
    build:
      context: ./mobile-frontend
    container_name: it-dashboard-mobile-frontend
    restart: unless-stopped
    ports:
      - "${MOBILE_FRONTEND_PORT:-7001}:80"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: it-dashboard-oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${NEXTCLOUD_OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://200
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: ${OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL:-true}
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: /etc/oauth2-proxy/templates
    volumes:
      - ./docker/oauth2-proxy/templates:/etc/oauth2-proxy/templates:ro

  ollama:
    build:
      context: ./docker/ollama
    container_name: it-dashboard-ollama
    restart: unless-stopped
    profiles:
      - ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_PRELOAD_MODELS: ${OLLAMA_PRELOAD_MODELS:-qwen3:8b}
      OLLAMA_LLM_LIBRARY: ${OLLAMA_LLM_LIBRARY:-cpu}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-14}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

volumes:
  dashboard-db:
  ollama-data:
  marketplace-import-data:
  meta-hub-data:
