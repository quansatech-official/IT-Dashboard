x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

x-web-hardening: &web-hardening
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16
    container_name: it-dashboard-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-it_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - dashboard-db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-it_user} -d ${POSTGRES_DB:-it_dashboard}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: it-dashboard-backend
    restart: unless-stopped
    <<: *app-hardening
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-it_dashboard}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-6}
      INTERNAL_AI_STREAM_TIMEOUT_SECONDS: ${INTERNAL_AI_STREAM_TIMEOUT_SECONDS:-300}
      OLLAMA_REQUEST_KEEP_ALIVE: ${OLLAMA_REQUEST_KEEP_ALIVE:-30m}
      OLLAMA_STREAM_ENABLED: ${OLLAMA_STREAM_ENABLED:-0}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-8}
      OLLAMA_PROMPT_MAX_CHARS: ${OLLAMA_PROMPT_MAX_CHARS:-12000}
      OLLAMA_PROMPT_TOKEN_MARGIN: ${OLLAMA_PROMPT_TOKEN_MARGIN:-96}
      OLLAMA_MAX_TOKENS_HARD_LIMIT: ${OLLAMA_MAX_TOKENS_HARD_LIMIT:-320}
      OLLAMA_SLOW_REQUEST_MS: ${OLLAMA_SLOW_REQUEST_MS:-25000}
      OLLAMA_RESPONSE_CACHE_TTL_SECONDS: ${OLLAMA_RESPONSE_CACHE_TTL_SECONDS:-180}
      OLLAMA_RESPONSE_CACHE_MAX_ENTRIES: ${OLLAMA_RESPONSE_CACHE_MAX_ENTRIES:-400}
      OLLAMA_MISSING_MODEL_TTL_SECONDS: ${OLLAMA_MISSING_MODEL_TTL_SECONDS:-600}
      DB_STARTUP_RETRY_ATTEMPTS: ${DB_STARTUP_RETRY_ATTEMPTS:-30}
      DB_STARTUP_RETRY_DELAY_SECONDS: ${DB_STARTUP_RETRY_DELAY_SECONDS:-2}
      CUSTOMER_META_HUB_URL: ${CUSTOMER_META_HUB_URL:-http://meta-hub:8010}
      CUSTOMER_META_HUB_ENABLED: ${CUSTOMER_META_HUB_ENABLED:-1}
      CUSTOMER_META_HUB_TIMEOUT_SECONDS: ${CUSTOMER_META_HUB_TIMEOUT_SECONDS:-8}
      META_HUB_INTERNAL_TOKEN: ${META_HUB_INTERNAL_TOKEN:?META_HUB_INTERNAL_TOKEN is required}
      INFRA_DISCOVERY_API_URL: ${INFRA_DISCOVERY_API_URL:-}
      INFRA_DISCOVERY_TOKEN: ${INFRA_DISCOVERY_TOKEN:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      M365_OAUTH_CLIENT_ID: ${M365_OAUTH_CLIENT_ID:-}
      M365_OAUTH_CLIENT_SECRET: ${M365_OAUTH_CLIENT_SECRET:-}
      M365_OAUTH_AUTHORITY: ${M365_OAUTH_AUTHORITY:-organizations}
      M365_OAUTH_REDIRECT_URI: ${M365_OAUTH_REDIRECT_URI:-}
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-9873}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 120s

  meta-hub:
    build:
      context: ./meta-hub
    container_name: it-dashboard-meta-hub
    restart: unless-stopped
    <<: *app-hardening
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      META_HUB_BACKEND_URL: ${META_HUB_BACKEND_URL:-http://backend:8000}
      META_HUB_REFRESH_SECONDS: ${META_HUB_REFRESH_SECONDS:-300}
      META_HUB_TIMEOUT_SECONDS: ${META_HUB_TIMEOUT_SECONDS:-120}
      META_HUB_CACHE_FILE: ${META_HUB_CACHE_FILE:-/data/customer_development_snapshot.json}
      META_HUB_SOURCE_INCLUDE_INACTIVE: ${META_HUB_SOURCE_INCLUDE_INACTIVE:-1}
      META_HUB_SOURCE_FULL: ${META_HUB_SOURCE_FULL:-1}
      META_HUB_AUTO_REFRESH: ${META_HUB_AUTO_REFRESH:-1}
      META_HUB_INTERNAL_TOKEN: ${META_HUB_INTERNAL_TOKEN:?META_HUB_INTERNAL_TOKEN is required}
      META_HUB_RMM_TIMEOUT_SECONDS: ${META_HUB_RMM_TIMEOUT_SECONDS:-30}
      META_HUB_MAC_VENDOR_LOOKUP_ENABLED: ${META_HUB_MAC_VENDOR_LOOKUP_ENABLED:-1}
      META_HUB_MAC_VENDOR_API_TEMPLATE: ${META_HUB_MAC_VENDOR_API_TEMPLATE:-https://api.macvendors.com/{mac}}
      META_HUB_MAC_VENDOR_TIMEOUT_SECONDS: ${META_HUB_MAC_VENDOR_TIMEOUT_SECONDS:-1.8}
      META_HUB_MAC_VENDOR_MAX_LOOKUPS_PER_REFRESH: ${META_HUB_MAC_VENDOR_MAX_LOOKUPS_PER_REFRESH:-30}
      META_HUB_MAC_VENDOR_CACHE_TTL_SECONDS: ${META_HUB_MAC_VENDOR_CACHE_TTL_SECONDS:-2592000}
      META_HUB_AI_PREANALYSIS_ENABLED: ${META_HUB_AI_PREANALYSIS_ENABLED:-0}
      META_HUB_AI_TIMEOUT_SECONDS: ${META_HUB_AI_TIMEOUT_SECONDS:-12}
      META_HUB_AI_MAX_CUSTOMERS: ${META_HUB_AI_MAX_CUSTOMERS:-6}
      META_HUB_AI_MAX_JOBS_PER_RUN: ${META_HUB_AI_MAX_JOBS_PER_RUN:-8}
      META_HUB_AI_TTL_SECONDS: ${META_HUB_AI_TTL_SECONDS:-43200}
      META_HUB_AI_BACKEND_COOLDOWN_SECONDS: ${META_HUB_AI_BACKEND_COOLDOWN_SECONDS:-1800}
    volumes:
      - meta-hub-data:/data
    ports:
      - "${META_HUB_BIND_IP:-127.0.0.1}:${META_HUB_PORT:-8010}:8010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s

  marketplace-import-service:
    build:
      context: ./marketplace-import-service
    container_name: it-dashboard-marketplace-import
    restart: unless-stopped
    <<: *app-hardening
    logging: *default-logging
    environment:
      TD_SYNNEX_BASE_URL: ${TD_SYNNEX_BASE_URL:-https://api.streamone.com}
      TD_SYNNEX_TOKEN_URL: ${TD_SYNNEX_TOKEN_URL:-https://api.streamone.com/oauth/token}
      TD_SYNNEX_CLIENT_ID: ${TD_SYNNEX_CLIENT_ID:-}
      TD_SYNNEX_CLIENT_SECRET: ${TD_SYNNEX_CLIENT_SECRET:-}
      TD_SYNNEX_ACCOUNT_ID: ${TD_SYNNEX_ACCOUNT_ID:-}
      ALSO_SFTP_HOST: ${ALSO_SFTP_HOST:-}
      ALSO_SFTP_PORT: ${ALSO_SFTP_PORT:-22}
      ALSO_SFTP_USER: ${ALSO_SFTP_USER:-}
      ALSO_SFTP_PASSWORD: ${ALSO_SFTP_PASSWORD:-}
      ALSO_SFTP_DIR: ${ALSO_SFTP_DIR:-}
      ALSO_FEED_DB_PATH: ${ALSO_FEED_DB_PATH:-/data/also_feed.db}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
    ports:
      - "${MARKETPLACE_IMPORT_BIND_IP:-127.0.0.1}:${MARKETPLACE_IMPORT_PORT:-9876}:8000"
    volumes:
      - marketplace-import-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s

  telephony:
    build:
      context: ./backend
    container_name: it-dashboard-telephony
    restart: unless-stopped
    <<: *app-hardening
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-it_dashboard}}
      NFON_CTI_BASE_URL: ${NFON_CTI_BASE_URL:-}
      NFON_CTI_USER: ${NFON_CTI_USER:-}
      NFON_CTI_PASSWORD: ${NFON_CTI_PASSWORD:-}
      TELEPHONY_STREAM_ENABLED: ${TELEPHONY_STREAM_ENABLED:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    command: ["uvicorn", "telephony.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/telephony/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: it-dashboard-frontend
    restart: unless-stopped
    <<: *web-hardening
    logging: *default-logging
    ports:
      - "${FRONTEND_BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-7000}:80"
    depends_on:
      backend:
        condition: service_healthy
      telephony:
        condition: service_healthy
      mobile-frontend:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  mobile-frontend:
    build:
      context: ./mobile-frontend
    container_name: it-dashboard-mobile-frontend
    restart: unless-stopped
    <<: *web-hardening
    logging: *default-logging
    ports:
      - "${MOBILE_FRONTEND_BIND_IP:-127.0.0.1}:${MOBILE_FRONTEND_PORT:-7001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: it-dashboard-oauth2-proxy
    restart: unless-stopped
    <<: *app-hardening
    logging: *default-logging
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${NEXTCLOUD_OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID:?NEXTCLOUD_OIDC_CLIENT_ID is required}
      OAUTH2_PROXY_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET:?NEXTCLOUD_OIDC_CLIENT_SECRET is required}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET is required}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://200
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      # Preserve the repo's existing env name while exporting the flag name
      # oauth2-proxy actually expects for OIDC email-based authorization.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: ${OAUTH2_PROXY_EMAIL_CLAIM:-email}
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: ${OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL:-false}
      OAUTH2_PROXY_SET_XAUTHREQUEST: ${OAUTH2_PROXY_SET_XAUTHREQUEST:-true}
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: /etc/oauth2-proxy/templates
    volumes:
      - ./docker/oauth2-proxy/templates:/etc/oauth2-proxy/templates:ro

  ollama:
    build:
      context: ./docker/ollama
    container_name: it-dashboard-ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    profiles:
      - ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_PRELOAD_MODELS: ${OLLAMA_PRELOAD_MODELS:-qwen3:8b}
      OLLAMA_LLM_LIBRARY: ${OLLAMA_LLM_LIBRARY:-cpu}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-14}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"

volumes:
  dashboard-db:
  ollama-data:
  marketplace-import-data:
  meta-hub-data:

networks:
  default:
    name: it_dashboard_default
