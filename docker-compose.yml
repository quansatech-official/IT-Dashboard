version: "3.8"

services:
  db:
    image: postgres:16
    container_name: it-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: it_dashboard
      POSTGRES_USER: it_user
      POSTGRES_PASSWORD: it_secret_password
    volumes:
      - dashboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: it-dashboard-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://it_user:it_secret_password@db:5432/it_dashboard
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: it-dashboard-frontend
    restart: unless-stopped
    ports:
      - "7000:80"

volumes:
  dashboard-db:
