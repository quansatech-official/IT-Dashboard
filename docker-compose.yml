version: "3.8"

services:
  db:
    image: postgres:16
    container_name: it-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-it_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_secret_password}
    volumes:
      - dashboard-db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: it-dashboard-backend
    restart: unless-stopped
    depends_on:
      - db
      - ollama
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:-it_secret_password}@db:5432/${POSTGRES_DB:-it_dashboard}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    ports:
      - "${BACKEND_PORT:-9873}:8000"

  telephony:
    build:
      context: ./backend
    container_name: it-dashboard-telephony
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:-it_secret_password}@db:5432/${POSTGRES_DB:-it_dashboard}}
      NFON_CTI_BASE_URL: ${NFON_CTI_BASE_URL:-}
      NFON_CTI_USER: ${NFON_CTI_USER:-}
      NFON_CTI_PASSWORD: ${NFON_CTI_PASSWORD:-}
      TELEPHONY_STREAM_ENABLED: ${TELEPHONY_STREAM_ENABLED:-}
    command: ["uvicorn", "telephony.app:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
    container_name: it-dashboard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-7000}:80"
    depends_on:
      - oauth2-proxy

  beacon:
    build:
      context: ./beacon
    container_name: it-dashboard-beacon
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:-it_secret_password}@db:5432/${POSTGRES_DB:-it_dashboard}}
    ports:
      - "${BEACON_PORT:-9875}:8000"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: it-dashboard-oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${NEXTCLOUD_OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://200
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: ${OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL:-true}
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: /etc/oauth2-proxy/templates
    volumes:
      - ./docker/oauth2-proxy/templates:/etc/oauth2-proxy/templates:ro

  ollama:
    build:
      context: ./docker/ollama
    container_name: it-dashboard-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

volumes:
  dashboard-db:
  ollama-data:
