version: "3.8"

services:
  db:
    image: postgres:16
    container_name: it-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-it_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_secret_password}
    volumes:
      - dashboard-db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: it-dashboard-backend
    restart: unless-stopped
    depends_on:
      - db
      - ollama
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-it_user}:${POSTGRES_PASSWORD:-it_secret_password}@db:5432/${POSTGRES_DB:-it_dashboard}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    ports:
      - "${BACKEND_PORT:-9873}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: it-dashboard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-7000}:80"

  ollama:
    image: ollama/ollama:latest
    container_name: it-dashboard-ollama
    restart: unless-stopped
    pull_policy: missing
    command: >
      sh -c "
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        if ! ollama list | awk '{print $1}' | grep -q \"^${OLLAMA_MODEL:-llama3.1}$\"; then
          ollama pull ${OLLAMA_MODEL:-llama3.1};
        fi;
        wait -n
      "
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

volumes:
  dashboard-db:
  ollama-data:
