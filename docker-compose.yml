version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: it-dashboard-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: it-dashboard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: it-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - dashboard-db:/var/lib/postgresql/data

volumes:
  dashboard-db:
