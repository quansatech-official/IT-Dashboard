version: "3.8"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.example
    volumes:
      - dashboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: it-dashboard-backend
    depends_on:
      - db
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    image: it-dashboard-frontend
    ports:
      - "8080:80"

volumes:
  dashboard-db:
