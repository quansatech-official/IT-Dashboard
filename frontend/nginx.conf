server {
    server_tokens off;
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Docker DNS can change container IPs on recreate. Resolve upstreams dynamically.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $up_oauth2_proxy http://oauth2-proxy:4180;
    set $up_oauth2_auth http://oauth2-proxy:4180/oauth2/auth;
    set $up_mobile_frontend http://mobile-frontend:80;
    set $up_backend http://backend:8000;
    set $up_telephony http://telephony:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- OAuth2 Proxy (Nextcloud SSO) ---
    location /oauth2/ {
        proxy_pass $up_oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass $up_oauth2_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    }

    auth_request_set $user $upstream_http_x_auth_request_user;
    auth_request_set $email $upstream_http_x_auth_request_email;

    # --- Mobil-Frontend ---
    location /mobil/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        proxy_pass $up_mobile_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-User $user;
        proxy_set_header X-Auth-Request-Email $email;
    }

    # --- YoPass Embed Proxy ---
    location /tools/yopass/ {
        proxy_pass https://share.quansatech.at/;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-store, max-age=0" always;

        proxy_set_header Host share.quansatech.at;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host share.quansatech.at;
        proxy_set_header Referer https://share.quansatech.at/;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;

        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript text/css;

        sub_filter 'href="/' 'href="/tools/yopass/';
        sub_filter 'src="/' 'src="/tools/yopass/';
        sub_filter 'url(/' 'url(/tools/yopass/';
        sub_filter '"/assets/' '"/tools/yopass/assets/';
        sub_filter '"/theme-init.js' '"/tools/yopass/theme-init.js';
        sub_filter '"/yopass.svg' '"/tools/yopass/yopass.svg';
        sub_filter '"/config' '"/tools/yopass/config';
        sub_filter '"/secret' '"/tools/yopass/secret';
        sub_filter '"/file' '"/tools/yopass/file';
        sub_filter '"/upload' '"/tools/yopass/upload';
        sub_filter "'/assets/" "'/tools/yopass/assets/";
        sub_filter "'/theme-init.js" "'/tools/yopass/theme-init.js";
        sub_filter "'/yopass.svg" "'/tools/yopass/yopass.svg";
        sub_filter "'/config" "'/tools/yopass/config";
        sub_filter "'/secret" "'/tools/yopass/secret";
        sub_filter "'/file" "'/tools/yopass/file";
        sub_filter "'/upload" "'/tools/yopass/upload";
    }

    location = /index.html {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # --- 1. SPA-Routing für den Hauptpfad ---
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        try_files $uri $uri/ /index.html;
    }


    # --- 3. Backend Proxy-Weiterleitung ---
    location /api/telephony/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        proxy_pass $up_telephony;
        
        # Standard-Proxy-Header (empfohlen)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-User $user;
        proxy_set_header X-Auth-Request-Email $email;
    }

    # Discovery ingest endpoint is machine-to-machine (RMM script) and
    # validated via X-Discovery-Token in backend.
    location = /api/infrastructure/discovery {
        proxy_pass $up_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/rmm/audits/cleanup {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        proxy_pass $up_backend;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-User $user;
        proxy_set_header X-Auth-Request-Email $email;
    }

    location /api/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        proxy_pass $up_backend;
        
        # Standard-Proxy-Header (empfohlen)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-User $user;
        proxy_set_header X-Auth-Request-Email $email;
    }
}
